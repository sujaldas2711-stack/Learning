<!DOCTYPE html>
<html>
  <head>
    <title> Variables </title>
    

  </head>
  <body>  
    <script>
      let v1 = 3;
      console.log(v1);
      // Use let only once for variable declaration

      let _calc =  2 +2 ;
      console.log(_calc + 2);
      let $price = 4;
      console.log($price);
      // Only $ and _ allowed for identifiers

      v1 = 14;
      console.log(v1);

    </script>


  </body>
</html>
